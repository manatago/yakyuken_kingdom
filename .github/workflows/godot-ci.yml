name: Godot CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  headless-tests:
    name: Headless project and item tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Godot 4.6.2
        env:
          GODOT_VERSION: 4.6.2-stable
          GODOT_ARCHIVE: Godot_v4.6.2-stable_linux.x86_64.zip
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$GODOT_ARCHIVE" \
            "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/$GODOT_ARCHIVE"
          unzip -q "$RUNNER_TEMP/$GODOT_ARCHIVE" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.6.2-stable_linux.x86_64"

      - name: Initialize script class cache
        run: |
          "$RUNNER_TEMP/godot/Godot_v4.6.2-stable_linux.x86_64" \
            --headless --path godot --editor --quit

      - name: Run battle system item tests
        run: |
          "$RUNNER_TEMP/godot/Godot_v4.6.2-stable_linux.x86_64" \
            --headless --path godot --script res://tests/RunBattleSystemItemTests.gd
