name: Electron scaffold

on:
  pull_request:
    paths:
      - 'electron/**'
      - 'electron.vite.*.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tests/**'
      - 'packages/**'
      - 'content/catalog/**'
      - '.github/workflows/electron-scaffold.yml'

jobs:
  smoke:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ui
      - run: npm run smoke:game
      - run: npm run smoke:editor
